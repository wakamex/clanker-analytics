[project]
name = "clanker-analytics"
version = "0.4.2"
description = "AI coding tool token analytics powered by DuckDB"
readme = "README.md"
license = "MIT AND OFL-1.1 AND CC-BY-4.0"
license-files = ["LICENSE", "src/clanker_analytics/OFL-ClankerMono.txt", "src/clanker_analytics/emoji/LICENSE-CC-BY-4.0.txt"]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.0",
    "matplotlib>=3.9",
    "ccusage>=0.1.10",
    "codex-cli-usage>=0.1.8",
    "gemini-cli-usage>=0.1.5",
    "agy-usage>=0.1.6",
    "zcode-cli-usage>=0.1.0",
    "model-prices>=0.0.3",
]

[project.urls]
Homepage = "https://github.com/wakamex/clanker-analytics"
Source = "https://github.com/wakamex/clanker-analytics"

[project.scripts]
clanker-analytics = "clanker_analytics.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
artifacts = ["src/clanker_analytics/*.ttf", "src/clanker_analytics/OFL-ClankerMono.txt", "src/clanker_analytics/emoji/*.png", "src/clanker_analytics/emoji/LICENSE-CC-BY-4.0.txt"]
