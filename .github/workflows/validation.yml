name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.29"
      - run: uv --no-config lock --check
      - run: uv --no-config run --locked pytest
      - run: uv --no-config build --no-sources
